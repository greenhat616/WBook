[package]
name = "wbook-core"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
description.workspace = true
documentation.workspace = true
repository.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chardetng = "1"
encoding_rs = "0.8"
unicode-bom = "2"

slab = "0.4"
str-utils = "0.3"

zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
language-tags = "0.3"
tempfile = "3"
# Not used yet; send-to-kindle returns as a feature later. Its rustls 0.20
# pulls in ring 0.16, which does not build for aarch64-pc-windows-msvc.
# send-to-kindle = "1"

# Not used yet, and its C++ build only slows down every release build.
# rocksdb = "0.25"

tera = "2"
rayon = "1"
toml = "1"

# workspace dependencies
anyhow = { workspace = true }
snafu = { workspace = true }

camino = { workspace = true }
config = { workspace = true }
jiff = { workspace = true }
regex = { workspace = true }
uuid = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }

tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["full"] }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
fontdb = "0.24.0"
ab_glyph = "0.2.32"

[target.'cfg(windows)'.dependencies]
codepage = "0.1"
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }

[dev-dependencies]
roxmltree = "0.21"
