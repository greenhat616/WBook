[workspace]
resolver = "2"
members = ["server", "tauri", "wbook-core", "wbook-command-macros"]

[workspace.package]
version = "0.1.0"
authors = ["a632079"]
edition = "2021"
description = "WBook is a tool to convert txt files to epub files with toc and metadata."
documentation = ""
repository = "https://github.com/greenhat616/wbook.git"
license = "LGPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
snafu = "0.9.1"

config = "0.15"

camino = { version = "1", features = ["serde1"] }
jiff = { version = "0.2", features = ["serde"] }
regex = "1.10"

serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
simd-json = { version = "0.18" }
specta = { version = "=2.0.0-rc.26", features = ["camino", "derive", "jiff"] }

tokio = { version = "1", features = ["full"] }

tracing = "0.1"
tracing-subscriber = "0.3"

[workspace.dependencies.uuid]
version = "1"
features = [
  "fast-rng",  # Use a faster (but still sufficiently random) RNG
  "macro-diagnostics",  # Enable better diagnostics for compile-time UUIDs
  "v4",  # Lets you generate random UUIDs
]

# tauri-specta-query and the tauri-specta APIs it needs are unreleased; they
# require Specta rc.26, which is likewise only available from git.
[patch.crates-io]
specta = { git = "https://github.com/specta-rs/specta.git", rev = "2757fa8899926dce7da999780c7edf2dc08a732a" }
specta-macros = { git = "https://github.com/specta-rs/specta.git", rev = "2757fa8899926dce7da999780c7edf2dc08a732a" }
specta-serde = { git = "https://github.com/specta-rs/specta.git", rev = "2757fa8899926dce7da999780c7edf2dc08a732a" }
specta-typescript = { git = "https://github.com/specta-rs/specta.git", rev = "2757fa8899926dce7da999780c7edf2dc08a732a" }
specta-util = { git = "https://github.com/specta-rs/specta.git", rev = "2757fa8899926dce7da999780c7edf2dc08a732a" }

[profile.release]
opt-level = "s"
strip = true
lto = true
codegen-units = 1
