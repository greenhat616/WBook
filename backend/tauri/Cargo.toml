[package]
name = "wbook"
edition.workspace = true
version = "0.1.0"
authors.workspace = true
description.workspace = true
documentation.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }

[dependencies]

wbook-core = { path = "../wbook-core" }
server = { path = "../server" }
wbook-command-macros = { path = "../wbook-command-macros" }

tauri = { version = "2.1.1", features = [] }
tauri-specta = { git = "https://github.com/specta-rs/tauri-specta.git", rev = "ebe38d6e0343a1f2e43fdd8f0b2bec9c294cb23e", features = ["typescript", "derive"] }
tauri-specta-query = { git = "https://github.com/specta-rs/tauri-specta.git", rev = "ebe38d6e0343a1f2e43fdd8f0b2bec9c294cb23e" }
specta-typescript = "=0.0.13"
axum = "0.8"
tempfile = "3"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }

# workspace dependencies
serde = { workspace = true }
serde_json = { workspace = true }
simd-json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
snafu = { workspace = true }
anyhow = { workspace = true }
camino = { workspace = true }
specta = { workspace = true }
tokio = { workspace = true }
tauri-plugin-shell = "2"
tauri-plugin-sentry = "0.2"
tauri-plugin-dialog = "2"
base64 = "0.23.1"
reqwest = "0.12"
url = "2.5.8"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tower = { version = "0.5", features = ["util"] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
